<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Berita · SIMB DIY</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#eaf1fb;font-family:system-ui,sans-serif}.box{max-width:720px;margin:32px auto;background:#fff;border-radius:16px;padding:28px}</style></head>
<body><div class="box">
<h1 class="h4">Editor Berita</h1>
<p class="text-secondary small">Isi form, klik <b>Buat kode</b>, lalu tempel hasilnya di paling atas daftar <code>window.BERITA = [</code> pada <code>data/berita.js</code>. Simpan, kirim ke tim (Git/Drive), selesai.</p>
<div class="row g-3">
 <div class="col-12"><label class="form-label fw-bold">Judul</label><input id="judul" class="form-control"></div>
 <div class="col-md-6"><label class="form-label fw-bold">Kategori</label><select id="kategori" class="form-select"><option>Kejadian</option><option>Edukasi</option><option>Lingkungan</option><option>Persiapan</option><option>Kesehatan</option></select></div>
 <div class="col-md-6"><label class="form-label fw-bold">Tanggal</label><input id="tanggal" type="date" class="form-control"></div>
 <div class="col-12"><label class="form-label fw-bold">Isi (baris kosong = paragraf baru)</label><textarea id="isi" rows="6" class="form-control"></textarea></div>
 <div class="col-md-5"><label class="form-label">Nama sumber</label><input id="sumber" class="form-control" placeholder="BPBD DIY"></div>
 <div class="col-md-7"><label class="form-label">Tautan sumber</label><input id="url" class="form-control" placeholder="https://"></div>
</div>
<button id="buat" class="btn btn-primary mt-3">Buat kode</button>
<textarea id="hasil" rows="9" class="form-control mt-3 font-monospace small" readonly placeholder="Hasil muncul di sini"></textarea>
<button id="salin" class="btn btn-outline-secondary btn-sm mt-2">Salin</button> <span id="ok" class="small text-success"></span>
</div>
<script>
const $=id=>document.getElementById(id);
$('tanggal').value=new Date().toISOString().slice(0,10);
$('buat').onclick=()=>{
  if(!$('judul').value.trim()||!$('isi').value.trim())return alert('Judul dan isi wajib diisi.');
  const o={kategori:$('kategori').value,judul:$('judul').value.trim(),isi:$('isi').value.trim().replace(/\n{2,}/g,'\n\n'),tanggal:$('tanggal').value};
  if($('sumber').value.trim())o.sumber=$('sumber').value.trim();
  if($('url').value.trim())o.url=$('url').value.trim();
  $('hasil').value=JSON.stringify(o,null,2)+',';
};
$('salin').onclick=()=>{$('hasil').select();navigator.clipboard.writeText($('hasil').value).then(()=>{$('ok').textContent='Tersalin'})};
</script></body></html>
